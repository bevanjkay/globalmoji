name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
      - name: Install tools
        run: brew install xcodegen
      - name: Generate project
        run: make generate
      - name: Package
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: Scripts/package.sh "${GITHUB_REF_NAME}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Globalmoji-${{ github.ref_name }}
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Globalmoji ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Builds are currently ad-hoc signed and not notarised. After installing, run \`xattr -d com.apple.quarantine /Applications/Globalmoji.app\` or right-click › Open the first time."
