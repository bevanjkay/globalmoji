name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat
      - name: Lint
        run: make lint
      - name: Test packages
        run: make test
      - name: Generate project
        run: make generate
      - name: Build app
        run: make build
