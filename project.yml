name: Globalmoji
options:
  bundleIdPrefix: me.bevankay
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    GIPHY_API_KEY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  PickerCore:
    path: Packages/PickerCore
  InputEngine:
    path: Packages/InputEngine
targets:
  Globalmoji:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PickerCore
      - package: InputEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Globalmoji
        CFBundleDisplayName: Globalmoji
        CFBundleIdentifier: me.bevankay.globalmoji
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "MIT License"
        GiphyAPIKey: "$(GIPHY_API_KEY)"
    entitlements:
      path: App/Globalmoji.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bevankay.globalmoji
schemes:
  Globalmoji:
    build:
      targets:
        Globalmoji: all
    run:
      config: Debug
    archive:
      config: Release
